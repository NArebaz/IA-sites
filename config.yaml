# Pacote de configuração padrão para o LocalIA
# NÃO coloque chaves reais neste arquivo no repositório público.
# Prefira exportar variáveis de ambiente ou preencher localmente antes de executar.

# Integrações
google_places_api_key: ""        # opcional: Places API (melhor cobertura)
google_geocode_api_key: ""       # opcional: Google Geocoding API

# Saída
output_pdf: false

# Informações do seu negócio (aparecem no rodapé dos orçamentos)
company:
  name: "Sua Empresa"
  contact_email: "contato@seudominio.com"
  contact_phone: "+55 11 9XXXX-XXXX"

# SMTP (opcional) - recomendo usar variáveis de ambiente para senha
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  use_tls: true
  from_email: ""

# Avaliador de sites
evaluator:
  timeout: 6
  user_agent: "LocalIA/1.0 (+seu-email)"
